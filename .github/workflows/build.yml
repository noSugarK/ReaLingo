name: build & release

# macOS and Linux bundles cannot be produced from a Windows machine, so this is how those
# binaries get made.
#
#   workflow_dispatch  -> build all three, attach as workflow artifacts
#   push tag v*        -> the same, plus a GitHub release the bundles are uploaded to
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Runs on every trigger but does its work only for a tag, so `bundle` can depend on it
  # unconditionally instead of juggling always()/skipped results.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME does not match app version $have — bump the version or retag" >&2
            exit 1
          fi

      # Draft: bundles are attached as each platform finishes, and it only goes public once
      # every platform has succeeded.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --draft --title "ReaLingo $GITHUB_REF_NAME" --generate-notes

  bundle:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            # .deb only. Its Depends (see tauri.conf.json) let apt pull webkit2gtk and
            # appindicator in, so the ~90 MB AppImage — which exists to carry its own copy
            # of WebKitGTK for distros without it — buys nothing on our stated target of
            # Ubuntu 22.04+. Add `,appimage` or `,rpm` here if other distros ever matter.
            bundles: --bundles deb

          # One universal binary instead of separate Intel/ARM jobs: the macos-13 runner was
          # retired in Dec 2025 (an x86_64 job just queues forever), and Apple Silicon hosts
          # can cross-compile x86_64 anyway. The resulting .dmg runs on both.
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ matrix.bundles }}

      # Only the installers. `bundle/**/*` also sweeps up the unpacked trees the bundlers
      # leave behind, which is half of why the Linux artifact was 192 MB — the same payload
      # uploaded twice over.
      - uses: actions/upload-artifact@v6
        with:
          name: realingo-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb

      # bash on every runner (Windows included) so one glob works across all three.
      - name: Attach bundles to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/*/*.{msi,exe,dmg,deb})
          if [ ${#files[@]} -eq 0 ]; then
            echo "no installers produced for ${{ matrix.target }}" >&2
            exit 1
          fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

  publish-release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # `needs` already guarantees every platform succeeded, so the draft can go public.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
