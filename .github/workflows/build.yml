name: build & release

# macOS and Linux bundles cannot be produced from a Windows machine, so this is how those
# binaries get made.
#
#   workflow_dispatch  -> build all three, attach as workflow artifacts
#   push tag v*        -> the same, plus a GitHub release the bundles are uploaded to
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  # Runs on every trigger but does its work only for a tag, so `bundle` can depend on it
  # unconditionally instead of juggling always()/skipped results.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          # Cargo.toml is the single source: tauri.conf.json omits `version` and falls back
          # to it, and package.json (private, never published) carries none.
          have=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$want" != "$have" ]; then
            echo "tag $GITHUB_REF_NAME does not match app version $have — bump the version or retag" >&2
            exit 1
          fi

      # Draft: bundles are attached as each platform finishes, and it only goes public once
      # every platform has succeeded.
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          # Hand-written notes for this tag go on top; the generated changelog follows them.
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          [ -f "$notes" ] || notes=/dev/null
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" \
            --draft "${prerelease[@]}" --title "ReaLingo $GITHUB_REF_NAME" --notes-file "$notes" --generate-notes

  bundle:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu
            bundles: --bundles deb,rpm

          # One universal binary instead of separate Intel/ARM jobs: the macos-13 runner was
          # retired in Dec 2025 (an x86_64 job just queues forever), and Apple Silicon hosts
          # can cross-compile x86_64 anyway. The resulting .dmg runs on both.
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx vue-tsc --noEmit
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }} ${{ matrix.bundles }}

      - name: Collect installers with system and architecture in their names
        run: node scripts/collect-installers.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@v6
        with:
          name: realingo-${{ matrix.target }}
          if-no-files-found: error
          path: installers/*

      # bash on every runner (Windows included) so one glob works across all three.
      - name: Attach bundles to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" installers/* --clobber

  # ARM64 APK, built and signed the same way LittleLobby's release pipeline does it.
  # The generated Gradle project lives in src-tauri/gen/ (gitignored), so CI runs
  # `android init` fresh every time — the repo stays desktop-shaped and the Android
  # specifics live in scripts/prepare-android.mjs.
  #
  # Without the four ANDROID_* secrets, the job still produces an installable test APK
  # (debug key, `.debug` id suffix); on a release tag the signing script refuses to run
  # unsigned, because temporary keys cannot support upgrades.
  android:
    needs: create-release
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android signing
        id: signing
        run: node scripts/configure-android-signing.mjs

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-arm64

      - run: npm ci

      - name: Initialize Android project
        run: |
          if [[ ! -f src-tauri/gen/android/app/build.gradle.kts ]]; then
            npm run tauri -- android init --ci --skip-targets-install
          fi
          chmod +x src-tauri/gen/android/gradlew
          node scripts/prepare-android.mjs

      - name: Build APK
        run: npm run tauri -- android build --ci --apk --target aarch64

      - name: Collect the installable APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          mapfile -d '' packages < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*' -print0)
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo 'Expected exactly one installable ARM64 APK'
            exit 1
          fi
          version=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          suffix=''
          if [[ "$SIGNED" != true ]]; then suffix='-test-signed'; fi
          mkdir -p installers
          cp "${packages[0]}" "installers/ReaLingo_${version}_android_arm64${suffix}.apk"
          expected_id=com.nosugark.realingo
          if [[ "$SIGNED" != true ]]; then expected_id="$expected_id.debug"; fi
          node scripts/verify-android-package.mjs "${packages[0]}" "$expected_id" "$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "${packages[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "${packages[0]}"
          python3 scripts/check-android-apk.py "${packages[0]}"
          ls -lh installers/*.apk

      - uses: actions/upload-artifact@v6
        with:
          name: realingo-android-arm64
          if-no-files-found: error
          path: installers/*.apk

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" installers/*.apk --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/realingo-upload.jks"

  publish-release:
    needs: [bundle, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Require CI and Android smoke tests for the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in ci.yml android-test.yml; do
            run_id=$(gh run list --workflow "$workflow" --branch main --commit "$GITHUB_SHA" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [[ -z "$run_id" ]]; then
              echo "No $workflow run found for release commit $GITHUB_SHA" >&2
              exit 1
            fi
            gh run watch "$run_id" --exit-status --interval 30
          done
      # `needs` already guarantees every platform succeeded, so the draft can go public.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false
          fi
