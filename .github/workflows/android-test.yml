name: Android tests

on:
  pull_request:
  push:
    branches: [feat/android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-22.04
    env:
      ANDROID_NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Install SDK and NDK
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android-test-x86_64
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run build
      - name: Build the release APK (including the Kotlin bridge)
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          chmod +x src-tauri/gen/android/gradlew
          node .github/scripts/prepare-android.mjs
          npm run tauri -- android build --ci --apk --target x86_64
      - name: Verify signature and 16 KB ZIP alignment
        run: |
          mapfile -d '' apks < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' -print0)
          test "${#apks[@]}" -eq 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "${apks[0]}"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "${apks[0]}"
          python3 .github/scripts/check-android-apk.py "${apks[0]}"
          mkdir -p smoke-apk
          cp "${apks[0]}" smoke-apk/realingo.apk
      - uses: actions/upload-artifact@v6
        with:
          name: android-smoke-apk
          path: smoke-apk/realingo.apk
          if-no-files-found: error

  launch:
    needs: apk
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            tag: default
            page-size: 4096
          - api: 35
            tag: google_apis_ps16k
            page-size: 16384
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: android-smoke-apk
          path: smoke-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          tag: ${{ matrix.tag }}
          disable-animations: true
          script: |
            test "$(adb shell getconf PAGE_SIZE | tr -d '\r')" = '${{ matrix.page-size }}'
            node .github/scripts/smoke-android.mjs smoke-apk/realingo.apk
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-api${{ matrix.api }}-diagnostics
          path: android-smoke/
