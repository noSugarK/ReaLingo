[package]
name = "realingo"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "realingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.17.1"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-store = "2.4.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
