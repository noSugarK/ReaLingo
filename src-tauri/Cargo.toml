[package]
name = "realingo"
version = "0.5.1"
edition = "2021"
rust-version = "1.90"

[lib]
name = "realingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.17.1"
futures-util = "0.3.34"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }
tauri = { version = "2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-store = "2.4.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
# Same major as cpal's, so it is not built twice. Process loopback is not in cpal.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# `#[implement]` expands to paths under `windows_core`, so it has to be a direct dependency.
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
# cpal's own versions; its loopback tap excludes nobody, see src/tap.rs.
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
