[package]
name = "realingo"
version = "0.8.1"
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "realingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cpal = "0.17.1"
futures-util = "0.3.34"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm"] }
# Tauri 2.12 / Tao 0.37 initializes ndk-context before cpal enumerates Android devices.
# Older Tao leaves it unset, so the first list_devices IPC aborts in the JNI callback.
tauri = { version = "2.12.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-store = "2.4.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# TLS split per target: native-tls has no Android backend, so mobile builds rustls with
# bundled roots. Desktop keeps the exact same native-tls stack it has always built with.
# Declared only per target — one table per platform, no base entry to merge defaults with.
[target.'cfg(not(target_os = "android"))'.dependencies]
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
# No Android backend exists; secret.rs stubs itself out there and the frontend keeps the
# key in settings.json, the same fallback as a Linux box without Secret Service.
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
# cpal's AAudio backend is selected by target_os, not a feature (0.17 has no `aaudio`).
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
# tokio-tungstenite deliberately selects no crypto provider. Without one the
# first wss:// connection panics in ClientConfig::builder (plain ws:// never does).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# The existing JNI version is shared with Tauri; only PCM crosses this native boundary.

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
# Same major as cpal's, so it is not built twice. Process loopback is not in cpal.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# `#[implement]` expands to paths under `windows_core`, so it has to be a direct dependency.
windows-core = "0.61"

[target.'cfg(target_os = "macos")'.dependencies]
# cpal's own versions; its loopback tap excludes nobody, see src/tap.rs.
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
